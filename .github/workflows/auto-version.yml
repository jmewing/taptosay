name: Auto version bump

# Trigger on every push to any branch (including release branches).
# Adjust if you only want main.
# We'll keep it simple to match Offgrid‑Sentinel.
on:
  push:
    branches: [ '**' ]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip version]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: bump
        run: |
          CURRENT=$(cat VERSION 2>/dev/null || echo "0")
          IFS='.' read -r YEAR MONTH DAY COUNTER <<< "$CURRENT"
          TODAY=$(date -u +"%Y.%m.%d")
          if [[ "$YEAR.$MONTH.$DAY" == "$TODAY" ]]; then
            COUNTER=$((COUNTER + 1))
          else
            COUNTER=0
          fi
          NEXT="$TODAY.$COUNTER"
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT"

      - name: Update VERSION file
        run: |
          echo "${{ steps.bump.outputs.next }}" > VERSION

      - name: Update pubspec.yaml version
        run: |
          NEW="${{ steps.bump.outputs.next }}"
          # Set Flutter version (major.minor.patch) to date components; build number to counter.
          # Using full date as version string.
          sed -i.bak -E "s/^version: .*/version: $NEW+0/" pubspec.yaml

      - name: Commit and push version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stage the VERSION and pubspec.yaml files for commit.
          git add VERSION pubspec.yaml
          # Try to commit; if nothing changed (e.g., version already up‑to‑date), continue.
          git commit -m "chore: bump version to ${{ steps.bump.outputs.next }} [skip version]" || echo "No version changes to commit"
          # Push the commit; if the remote is already up‑to‑date, ignore the error.
          git push origin ${{ github.ref }} || echo "Push skipped – remote already has latest version"
