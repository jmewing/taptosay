name: Version

# SINGLE SOURCE OF TRUTH for the app version is pubspec.yaml's `version:` line.
#
#   version: 1.0.0+1
#     -> Android  versionName 1.0.0 / versionCode 1
#     -> iOS      CFBundleShortVersionString 1.0.0 / CFBundleVersion 1
#
# Flutter reads that one line and stamps BOTH platforms at build time, so the
# two stores always receive the same version. Do not duplicate the version
# anywhere else.
#
# WHY THIS FILE CHANGED (2026-09-30):
#   The old workflow rewrote pubspec.yaml to a DATE-based version
#   (YYYY.MM.DD.counter) on EVERY push. That clobbered deliberate release
#   versions (turning 1.0.0 into 2026.09.30.0) and left the built artifacts out
#   of sync with the repo — the shipped AAB was 1.0.3/2013 while pubspec said
#   0.0.0+0. That mismatch is the bug this workflow now avoids: it never
#   overwrites the version by date.
#
# HOW TO RELEASE NOW:
#   1. Edit `version:` in pubspec.yaml by hand when you ship a real release
#      (e.g. 1.0.0+1 -> 1.0.1+2). Bump the build number on every Play upload —
#      Play rejects a duplicate versionCode.
#   2. Or put `[version bump]` in a commit message to auto-increment the build
#      counter only (1.0.0+1 -> 1.0.0+2), keeping the name.
#
# Runs on main only, and only when asked. Otherwise it is a no-op.

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    # Only act on an explicit request. A normal push is a no-op.
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[version bump]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump build counter
        id: bump
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          NAME="${VERSION_LINE%%+*}"
          BUILD="${VERSION_LINE##*+}"
          if [[ "$BUILD" == "$VERSION_LINE" || -z "$BUILD" ]]; then
            BUILD=0
          fi
          NEW="${NAME}+$((BUILD + 1))"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^version: .*/version: ${NEW}/" pubspec.yaml
          # Keep the informational VERSION file in step with pubspec (not used by builds).
          echo "${NEW}" > VERSION
          echo "Version: $VERSION_LINE -> ${NEW}"

      - name: Commit and push
        run: |
          git add pubspec.yaml VERSION
          git commit -m "chore: version ${{ steps.bump.outputs.new }} [skip version]" \
            || echo "No version change to commit"
          git push || echo "Push skipped - remote already current"

      - name: Sanity check - Android and iOS names stay in lockstep
        run: |
          # Both platforms derive from pubspec, so a mismatch means something
          # has hard-coded a version outside pubspec. Fail loudly if so.
          NAME=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          echo "App version name is $NAME for BOTH Android and iOS."
