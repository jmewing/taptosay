name: iOS build

# Builds the iOS app on a macOS runner. There is no iOS toolchain on the Debian
# dev host, and the Mac mini does not have room for Flutter + CocoaPods (disk is
# effectively full), so CI is the build path of record for iOS.
#
# This produces an UNSIGNED build: it proves the app compiles and links, which is
# the main thing we cannot check locally. Signing/TestFlight needs a Developer
# account and Apple signing assets, added later as secrets.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    name: Build iOS (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version || true

      - name: Resolve packages
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Verify app bundle
        run: |
          test -d build/ios/iphoneos/Runner.app
          echo "Runner.app built:"
          du -sh build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' \
            build/ios/iphoneos/Runner.app/Info.plist || true

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ios
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
